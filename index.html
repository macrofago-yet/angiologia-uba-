<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBA Odonto - Angiología Leitner App</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #2563eb;
            --secondary: #334155;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 650px; }
        .header { text-align: center; margin-bottom: 20px; }
        .progress-container { background: var(--secondary); height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-bar { background: var(--primary); height: 100%; width: 0%; transition: 0.3s; }
        .card { background: var(--card); border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); position: relative; }
        .stats { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 15px; }
        .question { font-size: 1.25rem; font-weight: 600; line-height: 1.5; margin-bottom: 25px; }
        .options-grid { display: grid; gap: 12px; }
        .option { background: var(--secondary); border: 2px solid transparent; color: var(--text); padding: 15px; border-radius: 12px; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option:hover:not(.disabled) { border-color: var(--primary); background: #3f4e64; }
        .option.correct { background: var(--success); border-color: #16a34a; }
        .option.wrong { background: var(--danger); border-color: #dc2626; }
        .hint-box { margin-top: 20px; }
        #hint-btn { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        #hint-text { margin-top: 10px; font-size: 0.9rem; color: var(--text-dim); font-style: italic; display: none; }
        #feedback { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; background: #2d3a4f; border-left: 5px solid var(--primary); font-size: 0.95rem; }
        .next-btn { width: 100%; margin-top: 25px; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color: var(--primary);">Angiología UBA</h2>
        <p style="font-size: 0.9rem; color: var(--text-dim);">Flashcards Método Leitner (Pool Completo)</p>
    </div>

        <div class="options-grid" id="options"></div>
        
        <div class="hint-box">
            <button id="hint-btn" onclick="toggleHint()">💡 Ver Pista</button>
            <p id="hint-text"></p>
        </div>

        <div id="feedback"></div>
        <button id="next-btn" class="next-btn" onclick="handleNext()">Siguiente Tarjeta</button>
    </div>

   <div style="display: flex; flex-direction: row; align-items: flex-start; justify-content: center; width: 100%; max-width: 1000px; margin: 20px auto; gap: 30px;">

    
    </div>

        </div>

</div>
    </div>

    <div id="contenedor-preguntas" style="flex: 1; max-width: 600px;">

</div>
</div>
</div>

<script>
    // BASE DE DATOS PROCESADA (PREGUNTAS 1-40)
  const pool = [
    // BASE DE DATOS PROCESADA (PREGUNTAS 1-25)
    { q: "¿En qué parte de la cavidad torácica está localizado el corazón y sobre qué músculo se apoya?", a: "Sector inferior del mediastino anterior, sobre el diafragma", w: ["Mediastino superior, sobre el timo", "Mediastino posterior, sobre el esófago", "Sector medio, sobre la pleura"], h: "Está limitado lateralmente por los pulmones y abajo por el músculo respiratorio.", f: "Se localiza en el mediastino anterior inferior y descansa sobre el diafragma." },
    { q: "¿Qué dos órganos se encuentran a cada lado del corazón?", a: "Pulmones izquierdo y derecho", w: ["Hígado y estómago", "Riñones", "Tráquea y esófago"], h: "Son los órganos donde ocurre la hematosis.", f: "El corazón se ubica justamente entre ambos pulmones flanqueado por las pleuras." },
    { q: "¿Cuál es la dirección del ápex del corazón en un órgano in situ?", a: "Abajo, izquierda y adelante", w: ["Arriba, derecha y atrás", "Abajo, derecha y adelante", "Arriba, izquierda y adelante"], h: "Apunta hacia el 5to espacio intercostal izquierdo.", f: "La punta o ápex cardíaco tiene una orientación antero-inferior izquierda." },
    { q: "¿Qué definen la sístole y la diástole?", a: "Sístole: contracción/expulsión; Diástole: relajación/recepción", w: ["Sístole: relajación; Diástole: contracción", "Sístole: llenado auricular; Diástole: vaciado ventricular", "Sístole: reposo; Diástole: trabajo"], h: "Sístole es el latido activo y Diástole la recuperación.", f: "La sístole expulsa la sangre a las arterias y la diástole permite el llenado cardíaco." },
    { q: "¿Cuál es el recorrido de la circulación menor o pulmonar?", a: "Ventrículo derecho -> Arteria pulmonar -> Pulmones -> Venas pulmonares -> Aurícula izquierda", w: ["Ventrículo izquierdo -> Aorta -> Cuerpo -> Cavas -> Aurícula derecha", "Aurícula derecha -> Ventrículo derecho -> Aorta -> Pulmones", "Ventrículo derecho -> Venas pulmonares -> Pulmones -> Arteria pulmonar"], h: "Su objetivo es oxigenar la sangre carboxigenada.", f: "Inicia en el VD con sangre carboxigenada y retorna oxigenada a la AI." },
    { q: "¿Cuál es el punto de inicio y fin de la circulación mayor o sistémica?", a: "Inicia en Ventrículo izquierdo y termina en Aurícula derecha", w: ["Inicia en Ventrículo derecho y termina en Aurícula izquierda", "Inicia en Aurícula derecha y termina en Ventrículo izquierdo", "Inicia en Aorta y termina en Pulmones"], h: "Distribuye sangre oxigenada a todos los órganos.", f: "La sangre sale por la aorta desde el VI y regresa por las venas cavas a la AD." },
    { q: "¿Con qué figura geométrica se compara al corazón y cuáles son sus caras?", a: "Pirámide triangular: caras anterior (esternocostal), inferior (diafragmática) e izquierda (pulmonar)", w: ["Cubo: caras anterior, posterior, superior e inferior", "Esfera de dos caras", "Pirámide cuadrangular con base anterior"], h: "Tiene 3 caras principales según la terminología clásica.", f: "Se describe como una pirámide triangular con base posterior y vértice anterior." },
    { q: "¿Qué es una orejuela y cuántas son?", a: "Prolongaciones de las aurículas que actúan como cavidad de ampliación; son 2", w: ["Válvulas de las venas cavas; son 2", "Músculos del ventrículo; son 3", "Tabiques internos; son 2"], h: "Se encuentran en las cámaras superiores del corazón.", f: "Son cavidades de ampliación (derecha e izquierda) de las aurículas." },
    { q: "¿Qué surco encontramos en la cara anterior o esternocostal a nivel ventricular?", a: "Surco interventricular anterior", w: ["Surco coronario", "Surco interauricular", "Surco terminal"], h: "Separa ambos ventrículos por delante.", f: "En la cara esternocostal se visualiza el surco interventricular anterior." },
    { q: "¿Qué surco se encuentra en la cara pulmonar o izquierda?", a: "Surco auriculoventricular izquierdo", w: ["Surco interventricular posterior", "Surco de Theile", "Surco terminal"], h: "Separa la aurícula del ventrículo en el lado izquierdo.", f: "Es la porción izquierda del surco coronario." },
    { q: "¿Qué surcos se encuentran en la cara inferior o diafragmática?", a: "Surco auriculoventricular posterior y surco interventricular posterior", w: ["Surco terminal y surco anterior", "Surco interauricular únicamente", "Surco de Haller"], h: "Forman parte de la 'crux cordis'.", f: "En la cara inferior se aprecian el surco coronario posterior y el longitudinal posterior." },
    { q: "¿Qué surco se encuentra en la base del corazón?", a: "Surco interauricular", w: ["Surco interventricular", "Surco coronario", "Surco terminal"], h: "Divide las dos cavidades receptoras por detrás.", f: "En la base se localiza el surco que divide ambas aurículas." },
    { q: "¿En qué parte del corazón se localiza el fondo de saco de Haller?", a: "En la base, entre las venas pulmonares", w: ["En el vértice", "Detrás de la aorta", "En el ventrículo derecho"], h: "Es un receso del pericardio seroso.", f: "Se ubica en la base, separando las aurículas del esófago." },
    { q: "¿Cómo se denominan las dos hojas del pericardio seroso?", a: "Hoja parietal y hoja visceral", w: ["Pericardio fibroso y elástico", "Endocardio y epicardio", "Hoja interna y externa"], h: "La hoja visceral también es llamada epicardio.", f: "El pericardio seroso se divide en una hoja que tapiza el saco y otra el órgano." },
    { q: "¿Cómo se denomina el espacio delimitado entre ambas hojas pericárdicas?", a: "Cavidad pericárdica", w: ["Seno coronario", "Mediastino anterior", "Espacio de Haller"], h: "Contiene líquido para evitar la fricción.", f: "Es el espacio real o virtual entre las hojas parietal y visceral." },
    { q: "¿Hacia dónde se orienta el vértice y la base del pericardio fibroso?", a: "Vértice truncado superior y base inferior", w: ["Vértice inferior y base superior", "Base anterior y vértice posterior", "Vértice derecho y base izquierda"], h: "Tiene forma de pirámide cuadrangular.", f: "La base descansa en el diafragma y el vértice envuelve los grandes vasos." },
    { q: "¿Indique una relación de la cara anterior del pericardio fibroso?", a: "Pared anterior del tórax (esternón y cartílagos costales)", w: ["Esófago", "Columna vertebral", "Vena cava superior"], h: "Está justo detrás del peto esternocostal.", f: "Se relaciona con el esternón, las costillas y los pulmones que lo cubren parcialmente." },
    { q: "¿Enumere una relación de la cara posterior del pericardio fibroso?", a: "Esófago, nervios neumogástricos y arteria aorta", w: ["Esternón", "Timo", "Pared torácica"], h: "Son estructuras del mediastino posterior.", f: "Se relaciona íntimamente con el esófago y la aorta torácica." },
    { q: "¿Cuáles son los medios de fijación del pericardio?", a: "Ligamentos frenopericárdicos, esternopericárdicos y vertebropericárdicos", w: ["Músculos papilares", "Venas pulmonares", "Solo el diafragma"], h: "Son ligamentos que lo unen a huesos y músculos.", f: "Se fija mediante ligamentos al diafragma, esternón y columna vertebral." },
    { q: "¿Dónde se ubica el seno transverso de Theile?", a: "Entre la cara anterior de las aurículas y la pared posterior de la aorta y pulmonar", w: ["Detrás de la vena cava", "Entre los dos ventrículos", "En el vértice cardíaco"], h: "Es un túnel entre el pedículo arterial y venoso.", f: "Espacio pericárdico situado detrás de las grandes arterias emergentes." },
    { q: "¿Cómo está delimitado el orificio derecho del seno transverso de Theile?", a: "Orejuela derecha y arteria aorta", w: ["Orejuela izquierda y pulmonar", "Vena cava y esófago", "Aurícula izquierda"], h: "Es la entrada derecha de este espacio.", f: "Lo conforman la orejuela derecha y la aorta ascendente." },
    { q: "¿Qué dos estructuras quedan separadas por el fondo de saco de Haller?", a: "Cara posterior de las aurículas y el esófago", w: ["Aorta de la pulmonar", "Ventrículo derecho del izquierdo", "Vena cava superior de la inferior"], h: "Es un receso pericárdico posterior.", f: "Se interpone entre el corazón y el tubo digestivo (esófago)." },
    { q: "¿Qué forma tienen los ventrículos?", a: "Forma conoidea con base postero-superior", w: ["Cilíndrica", "Esférica", "Pirámide invertida"], h: "Su vértice se dirige al ápex cardíaco.", f: "Son conos cuya base mira hacia las aurículas." },
    { q: "¿Cómo se denomina y cuántas valvas tiene la válvula auriculoventricular derecha?", a: "Válvula tricúspide con 3 valvas", w: ["Válvula mitral con 2 valvas", "Válvula sigmoidea con 3 valvas", "Válvula bicúspide"], h: "Su nombre indica el número de componentes.", f: "La válvula derecha es la tricúspide, compuesta por tres valvas." },
    { q: "¿Cómo se denomina y cuántas valvas tiene la válvula auriculoventricular izquierda?", a: "Válvula mitral o bicúspide con 2 valvas", w: ["Válvula tricúspide con 3 valvas", "Válvula sigmoidea", "Válvula de Tebesio"], h: "Parece una mitra de obispo.", f: "La válvula izquierda es la mitral o bicúspide, con dos valvas." },
    // BASE DE DATOS PROCESADA (PREGUNTAS 26-50)
    { q: "¿Indique cuántas válvulas sigmoideas posee el corazón y cuántas valvas tienen?", a: "2 válvulas sigmoideas con 3 valvas cada una", w: ["1 válvula con 2 valvas", "3 válvulas con 3 valvas", "2 válvulas con 2 valvas"], h: "Se encuentran en el origen de los grandes vasos arteriales.", f: "El corazón tiene 2 válvulas sigmoideas (aórtica y pulmonar) y cada una posee 3 valvas[cite: 4]." },
        { q: "¿Cómo se disponen las valvas en la válvula sigmoidea Aórtica y en la Pulmonar?", a: "Aórtica: 2 anteriores y 1 posterior; Pulmonar: 2 posteriores y 1 anterior", w: ["Aórtica: 2 posteriores; Pulmonar: 2 anteriores", "Ambas: 2 anteriores y 1 posterior", "Aórtica: 3 anteriores; Pulmonar: 3 posteriores"], h: "Es una disposición inversa entre ambas válvulas.", f: "La sigmoidea aórtica tiene 2 valvas anteriores y 1 posterior, mientras que la pulmonar tiene 2 posteriores y 1 anterior[cite: 4]." },
        { q: "¿De cuál ventrículo vemos emerger a la arteria Aorta y de cuál a la Arteria Pulmonar?", a: "Aorta: ventrículo izquierdo; Pulmonar: ventrículo derecho", w: ["Aorta: ventrículo derecho; Pulmonar: ventrículo izquierdo", "Ambas del ventrículo izquierdo", "Aorta del ventrículo izquierdo; Pulmonar de la aurícula derecha"], h: "La aorta lleva sangre oxigenada al cuerpo.", f: "La arteria aorta nace del ventrículo izquierdo y la pulmonar del ventrículo derecho[cite: 4]." },
        { q: "¿A qué válvula arterial pertenecen los nódulos de Arancio y a cuál los de Morgagni?", a: "Aorta: nódulos de Arancio; Pulmonar: nódulos de Morgagni", w: ["Aorta: Morgagni; Pulmonar: Arancio", "Mitral: Arancio; Tricúspide: Morgagni", "Ambas poseen nódulos de Arancio"], h: "Se encuentran en el borde libre de las valvas sigmoideas.", f: "Los nódulos de Arancio están en la aorta y los de Morgagni en la pulmonar[cite: 4]." },
        { q: "¿Qué otro nombre reciben las columnas carnosas de 1er orden?", a: "Músculos papilares o pilares", w: ["Crestas supraventriculares", "Trabéculas de segundo orden", "Cuerdas tendinosas"], h: "Se unen a las cuerdas de las válvulas.", f: "Las columnas de primer orden se denominan músculos papilares o pilares[cite: 4]." },
        { q: "¿Qué tipo de columna carnosa es el músculo papilar?", a: "Primer orden", w: ["Segundo orden", "Tercer orden", "Cuarto orden"], h: "Son los pilares que tensan las válvulas.", f: "Los músculos papilares son clasificados como columnas carnosas de primer orden[cite: 4]." },
        { q: "¿Qué tipo de columnas carnosas poseen en sus extremos cuerdas tendinosas?", a: "Columnas carnosas de 1er orden", w: ["Columnas de 2do orden", "Columnas de 3er orden", "Músculos pectíneos"], h: "Su función es evitar el prolapso valvular.", f: "Solo las columnas de primer orden poseen cuerdas tendinosas en sus extremos[cite: 4]." },
        { q: "¿Qué tipo de columna carnosa es el moderator band y en qué cavidad se encuentra?", a: "Columna de 2do orden en el ventrículo derecho", w: ["Columna de 1er orden en el ventrículo izquierdo", "Columna de 3er orden en la aurícula derecha", "Columna de 2do orden en el ventrículo izquierdo"], h: "También se llama fascículo arqueado.", f: "El moderator band es una columna de segundo orden ubicada en el ventrículo derecho[cite: 4]." },
        { q: "¿Qué separa el espolón de Wolf o cresta supraventricular de His?", a: "Separa el infundíbulo pulmonar del orificio auriculoventricular", w: ["Separa la aorta de la pulmonar", "Separa las dos aurículas", "Separa el nodo sinusal del nodo AV"], h: "Se encuentra en el ventrículo derecho.", f: "Separa la cámara arterial (infundíbulo) de la cámara auricular (orificio AV)[cite: 4]." },
        { q: "¿Cuántas paredes posee cada ventrículo?", a: "3 paredes (anterior, posterior e interna)", w: ["2 paredes", "4 paredes", "1 pared circular"], h: "Tienen forma de pirámide triangular.", f: "Anatómicamente se describen tres paredes para cada ventrículo[cite: 4]." },
        { q: "¿Qué ventrículo posee sus paredes musculares más gruesas?", a: "Ventrículo izquierdo", w: ["Ventrículo derecho", "Aurícula derecha", "Aurícula izquierda"], h: "Debe manejar presiones sistémicas elevadas.", f: "El ventrículo izquierdo es el que tiene las paredes más gruesas[cite: 4]." },
        { q: "¿Qué accidentes presenta la pared posterior de la aurícula derecha?", a: "Tubérculo de Lower, cresta terminal de His y nodo sinusal", w: ["Válvula mitral", "Fosa oval únicamente", "Músculos papilares de 1er orden"], h: "Es la zona de llegada de las venas cavas.", f: "En esta pared se encuentran el tubérculo de Lower, la cresta terminal y el nodo de Keith y Flack[cite: 4]." },
        { q: "¿Qué desemboca en la pared inferior de la aurícula derecha?", a: "Orificio de la vena cava inferior y seno coronario", w: ["Vena cava superior", "Venas pulmonares", "Arteria aorta"], h: "Drenan la sangre del cuerpo y del propio corazón.", f: "La pared inferior recibe la VCI y el seno coronario[cite: 4]." },
        { q: "¿En qué cavidad se ubica el triángulo de Koch y qué aloja?", a: "Aurícula derecha; aloja el nódulo de Aschoff-Tawara", w: ["Ventrículo derecho; aloja el haz de His", "Aurícula izquierda; aloja la fosa oval", "Ventrículo izquierdo; aloja la válvula mitral"], h: "Es parte del sistema de conducción eléctrica.", f: "El triángulo de Koch está en la aurícula derecha y aloja el nódulo AV[cite: 4]." },
        { q: "¿Por qué columna carnosa transcurre la rama derecha del haz de His?", a: "Columna de 2do orden (fascículo arqueado)", w: ["Músculo papilar anterior", "Cresta supraventricular", "Válvula de Tebesio"], h: "Es el puente muscular del ventrículo derecho.", f: "La rama derecha del haz de His pasa por el fascículo arqueado[cite: 4]." },
        { q: "¿En qué nódulo se inicia el impulso nervioso del sistema cardionector?", a: "Nódulo de Keith y Flack (sinusal)", w: ["Nódulo de Aschoff-Tawara", "Haz de His", "Fibras de Purkinje"], h: "Se localiza en la aurícula derecha.", f: "El impulso se inicia en el nódulo sinusal o de Keith y Flack[cite: 4]." },
        { q: "¿A través de qué vasos recibe flujo la aurícula izquierda?", a: "Venas pulmonares derecha e izquierda", w: ["Vena cava superior e inferior", "Arteria pulmonar", "Seno coronario"], h: "Traen sangre oxigenada de los pulmones.", f: "La aurícula izquierda recibe la sangre mediante las venas pulmonares[cite: 4]." },
        { q: "¿Qué válvula presenta la desembocadura de la vena Cava Inferior?", a: "Válvula de Eustaquio", w: ["Válvula de Tebesio", "Válvula de Parchappe", "Válvula Mitral"], h: "Es un repliegue semilunar.", f: "La desembocadura de la VCI presenta la válvula de Eustaquio[cite: 4]." },
        { q: "¿En qué porción del corazón se encuentra la Fosa Oval?", a: "Cara interna de la aurícula derecha", w: ["Tabique interventricular", "Pared posterior del VI", "Orejuela izquierda"], h: "Es el vestigio de la comunicación fetal.", f: "La fosa oval se localiza en la cara interna (tabique) de la AD[cite: 4]." },
        { q: "¿Qué válvula encontramos en la pared interna de la aurícula izquierda?", a: "Válvula de Parchappe", w: ["Válvula de Eustaquio", "Válvula de Tebesio", "Fosa oval"], h: "Corresponde al lado izquierdo del tabique.", f: "En la pared interna de la AI se encuentra la válvula de Parchappe[cite: 4]." },
        { q: "¿De qué arterias son ramas las arterias subclavias derecha e izquierda?", a: "Derecha: TABC; Izquierda: Cayado aórtico", w: ["Derecha: Cayado; Izquierda: TABC", "Ambas del TABC", "Ambas del cayado aórtico"], h: "La izquierda tiene un trayecto intratorácico más largo.", f: "La subclavia derecha nace del TABC y la izquierda del cayado de la aorta[cite: 5]." },
        { q: "¿Qué arteria atraviesa el hiato interescalénico junto al plexo braquial?", a: "Arteria subclavia", w: ["Arteria carótida primitiva", "Vena subclavia", "Arteria vertebral"], h: "Pasa por detrás del músculo escaleno anterior.", f: "La arteria subclavia atraviesa el hiato interescalénico con el plexo braquial[cite: 5]." },
        { q: "¿De qué arteria se originan las arterias vertebrales?", a: "Arteria subclavia", w: ["Arteria carótida interna", "Arteria carótida externa", "Arteria aorta"], h: "Suben por los forámenes de las vértebras cervicales.", f: "Las arterias vertebrales son ramas de la subclavia[cite: 5]." },
        { q: "¿Con qué arteria se relaciona en su origen la carótida primitiva?", a: "Arteria subclavia", w: ["Arteria vertebral", "Arteria facial", "Arteria tiroidea"], h: "Nacen muy cerca una de la otra.", f: "En su origen, la carótida primitiva se relaciona con la subclavia[cite: 5]." },
        { q: "¿De qué arteria es rama la tiroidea inferior?", a: "Arteria subclavia", w: ["Arteria carótida externa", "Arteria carótida interna", "Arteria facial"], h: "Nace del tronco tirobicervicoescapular.", f: "La tiroidea inferior es una rama de la arteria subclavia[cite: 5]." },
        // BASE DE DATOS PROCESADA (PREGUNTAS 51-75)
        { q: "¿Qué nombre recibe la arteria subclavia en su tramo terminal?", a: "Arteria axilar", w: ["Arteria humeral", "Arteria braquial", "Arteria cubital"], h: "Cambia de nombre al pasar el borde inferior de la primera costilla.", f: "La arteria subclavia se continúa como arteria axilar[cite: 4]." },
        { q: "¿De dónde se origina la carótida primitiva derecha y de dónde la izquierda?", a: "Derecha: TABC; Izquierda: Cayado de la aorta", w: ["Derecha: Cayado; Izquierda: TABC", "Ambas del TABC", "Ambas del ventrículo izquierdo"], h: "La izquierda nace directamente del arco aórtico.", f: "La carótida primitiva derecha nace del tronco arterial braquiocefálico y la izquierda del cayado aórtico[cite: 4]." },
        { q: "¿Qué ramas terminales da el tronco arterial braquiocefálico?", a: "Arteria carótida primitiva derecha y arteria subclavia derecha", w: ["Carótida interna y externa", "Subclavia y vertebral", "Aorta y pulmonar"], h: "Se divide por detrás de la articulación esternoclavicular derecha.", f: "El TABC da origen a la carótida primitiva y a la subclavia del lado derecho[cite: 4]." },

        { q: "¿Qué trayecto describe la arteria lingual antes de hacerse profunda?", a: "Describe una curva de concavidad inferior que abraza al hioides", w: ["Trayecto recto ascendente", "Curva de concavidad superior", "Trayecto horizontal hacia la oreja"], h: "Pasa por el borde superior del hioides.", f: "Realiza una curva sobre el hioides antes de penetrar en la región sublingual." },
        { q: "¿Cómo se llama el espacio formado por el hioides y el digástrico donde se localiza la lingual?", a: "Ángulo de Beclard", w: ["Triángulo de Farabeuf", "Triángulo de Pirogoff", "Fosa submaxilar"], h: "Es el sitio de elección para su ligadura.", f: "El ángulo de Beclard es fundamental para abordar la arteria lingual." },
        { q: "¿Cuáles son los límites del ángulo de Beclard?", a: "Borde superior del hioides, vientre posterior del digástrico y borde posterior del hiogloso", w: ["Mandíbula, digástrico y milohioideo", "Hioides, esternocleidomastoideo y vago", "Estilohioideo, lengua y faringe"], h: "Compuesto por hueso y dos músculos.", f: "Se limita por el asta mayor del hioides, el digástrico y el músculo hiogloso." },
        { q: "¿Qué nervio pasa superficial al ángulo de Beclard?", a: "Nervio hipogloso mayor (XII)", w: ["Nervio glosofaríngeo", "Nervio lingual", "Nervio vago"], h: "Es el nervio motor de la lengua.", f: "El nervio hipogloso cruza superficialmente esta región." },
        { q: "¿Qué elementos forman el triángulo de Pirogoff?", a: "Borde posterior del milohioideo, nervio hipogloso mayor y tendón intermedio del digástrico", w: ["Hiogloso, hioides y arteria lingual", "Vena facial, hipogloso e hioides", "Mandíbula, digástrico y masetero"], h: "Es un triángulo pequeño de base superior.", f: "Sus límites son el milohioideo, el hipogloso y el digástrico." },
        { q: "¿En qué parte del triángulo de Pirogoff se encuentra la arteria lingual?", a: "En el fondo, separada por el músculo hiogloso", w: ["Superficial al nervio", "Entre el digástrico y la piel", "Dentro de la glándula sublingual"], h: "Debes seccionar un músculo para verla.", f: "La arteria es profunda al músculo hiogloso en este triángulo." },
        { q: "¿Cuáles son las ramas colaterales de la arteria lingual?", a: "Arteria hioidea y arteria dorsal de la lengua", w: ["Arteria sublingual y ranina", "Arteria facial y maxilar", "Arteria palatina y faríngea"], h: "Son dos ramas principales.", f: "Las colaterales son la hioidea (para el hioides) y la dorsal de la lengua (para la base)." },
        { q: "¿Qué estructuras irriga la arteria dorsal de la lengua?", a: "Base de la lengua, pilar anterior del velo del paladar y epiglotis", w: ["Punta de la lengua", "Músculo buccinador", "Glándula sublingual"], h: "Se distribuye por el sector posterior lingual.", f: "Es responsable de la nutrición del tercio posterior de la lengua." },
        { q: "¿Cuáles son las ramas terminales de la arteria lingual?", a: "Arteria sublingual y arteria ranina", w: ["Arteria hioidea y dorsal", "Arteria facial y mentoniana", "Arteria profunda y superficial"], h: "Nacen en el borde anterior del músculo hiogloso.", f: "La lingual termina dividiéndose en sublingual y ranina." },
        { q: "¿Qué estructuras irriga la arteria sublingual?", a: "Glándula sublingual, frenillo y encía lingual de incisivos inferiores", w: ["Dientes molares superiores", "Pabellón auricular", "Glándula parótida"], h: "Es vital para el piso de la boca.", f: "Irriga la glándula homónima, el suelo de la boca y la encía anteroinferior." },
        { q: "¿Cuál es el trayecto de la arteria ranina?", a: "Recorre la cara inferior de la lengua hasta el vértice", w: ["Va por el dorso de la lengua", "Perfora la mandíbula", "Se dirige al paladar"], h: "Acompaña al músculo lingual inferior.", f: "La ranina se dirige hacia adelante hasta la punta de la lengua." },
        { q: "¿Dónde nace la arteria facial respecto de la lingual?", a: "Por encima de la arteria lingual", w: ["Por debajo", "En el mismo tronco", "Por detrás"], h: "Es la tercera colateral anterior.", f: "Se origina en la cara anterior de la carótida externa, sobre la lingual." },
        { q: "¿Cuáles son las 3 curvas que describe la arteria facial?", a: "Curva supraglandular, curva submaxilar y curva facial (o retrocomisural)", w: ["Curva cervical, mandibular y nasal", "Curva parotídea, geniana y angular", "Curva interna, externa y superior"], h: "Rodea glándulas y huesos.", f: "Describe una curva sobre la glándula submaxilar, otra sobre la mandíbula y otra en la cara." },
         // BASE DE DATOS PROCESADA (PREGUNTAS 126-150)
         { q: "¿Qué glándula abraza la arteria facial en su primera curva?", a: "Glándula submaxilar", w: ["Glándula parótida", "Glándula sublingual", "Glándula tiroides"], h: "Es la curva supraglandular.", f: "La arteria facial rodea la glándula submaxilar antes de llegar al borde de la mandíbula." },
        { q: "¿En qué punto la arteria facial se hace superficial en la cara?", a: "Al nivel del borde inferior del maxilar inferior, delante del masetero", w: ["En el ángulo de la mandíbula", "Debajo del mentón", "Detrás del cuello del cóndilo"], h: "Es su segunda curva (submaxilar).", f: "Cruza la base de la mandíbula justo por delante de la inserción del músculo masetero." },
        { q: "¿Hacia qué accidente anatómico se dirige la arteria facial en su tramo final?", a: "Hacia el ángulo interno del ojo", w: ["Hacia el trago de la oreja", "Hacia la sien", "Hacia el agujero suborbitario"], h: "Allí cambia de nombre.", f: "Su trayecto termina dirigiéndose oblicuamente hacia la comisura palpebral interna." },
        { q: "¿Qué estructuras limita el Cuadrilátero de Chompret?", a: "Borde anterior del masetero, borde inferior de mandíbula, músculo triangular y músculo buccinador", w: ["Músculo cigomático, nariz, boca y mentón", "ECM, digástrico, hioides y mandíbula", "Parótida, masetero, mandíbula y Stenon"], h: "Es un espacio en la región de la mejilla.", f: "En este espacio la arteria facial se localiza tras cruzar el borde mandibular." },
        { q: "¿Cuáles son las colaterales cervicales de la arteria facial?", a: "Palatina inferior (o ascendente), ramas glandulares y submentoniana", w: ["Arteria coronaria y del ala de la nariz", "Arteria ranina y sublingual", "Arteria maxilar y temporal"], h: "Nacen antes de que la arteria llegue a la cara.", f: "Las cervicales son la palatina inferior, las glandulares submaxilares y la submentoniana." },
        { q: "¿Qué estructuras irriga la arteria palatina inferior o ascendente?", a: "Amígdalas palatinas, trompa de Eustaquio y paladar blando", w: ["Dientes incisivos", "Músculo masetero", "Seno maxilar"], h: "Nace en la primera curva de la facial.", f: "Se encarga de la nutrición del istmo de las fauces y el velo del paladar." },
        { q: "¿Qué estructuras irriga la arteria submentoniana?", a: "Glándula submaxilar, músculos milohioideo y digástrico, y encía lingual", w: ["Labio superior", "Punta de la lengua", "Músculo temporal"], h: "Corre por el borde inferior de la mandíbula.", f: "Irriga los tejidos blandos del suelo de la boca y la encía lingual inferior." },
        { q: "¿Cuáles son las colaterales faciales de la arteria facial?", a: "Arteria maseterina inferior, bucal, coronarias (labiales) y del ala de la nariz", w: ["Arteria sublingual y ranina", "Arteria meníngea y timpánica", "Arteria faríngea y occipital"], h: "Se distribuyen por la mímica y los labios.", f: "Son las ramas que emite una vez que se hace superficial en la cara." },
        { q: "¿Qué músculo perfora e irriga la arteria bucal (rama de la facial)?", a: "Músculo buccinador", w: ["Músculo masetero", "Músculo risorio", "Músculo orbicular"], h: "Llega a la mejilla.", f: "Tras perforar el buccinador, irriga la mucosa geniana y la encía vestibular." },
        { q: "¿Cómo se forman las arterias coronarias o labiales?", a: "Nacen de la facial a nivel de las comisuras", w: ["Nacen de la arteria maxilar interna", "Nacen de la arteria submentoniana", "Nacen de la arteria lingual"], h: "Son dos para cada labio.", f: "Se originan en la arteria facial cerca de los ángulos de la boca." },
        { q: "¿Qué forma el 'Círculo arterial de la boca'?", a: "La anastomosis de las cuatro arterias coronarias", w: ["La unión de la facial y la maxilar", "Las ramas de la carótida interna", "La lingual y la submentoniana"], h: "Rodea el orificio bucal.", f: "La unión de las coronarias superiores e inferiores de ambos lados forma este círculo." },
        { q: "¿Dónde se ubican las arterias coronarias en relación al labio?", a: "Entre el músculo orbicular y la capa glandular", w: ["Superficiales a la piel", "Dentro del hueso alveolar", "Por detrás de los dientes"], h: "Están en la profundidad del labio.", f: "Se sitúan profundamente, entre las fibras musculares y las glándulas labiales." },
        { q: "¿Cuál es la rama terminal de la arteria facial?", a: "Arteria Angular", w: ["Arteria Nasal", "Arteria Coronaria", "Arteria Maseterina"], h: "Se ubica en el ángulo interno del ojo.", f: "Tras dar ramos para la nariz, la facial termina como arteria angular." },
        { q: "¿Con qué arteria se anastomosa la arteria angular?", a: "Arteria Nasal (rama de la Oftálmica)", w: ["Arteria Maxilar", "Arteria Temporal Superficial", "Arteria Laríngea"], h: "Es la conexión entre carótida externa e interna.", f: "La anastomosis angular-nasal une los sistemas carotídeo externo e interno." },
        { q: "¿Qué ramas terminales da la carótida externa en la región parotídea?", a: "Arteria Temporal Superficial y Arteria Maxilar Interna", w: ["Arteria Facial y Lingual", "Arteria Occipital y Auricular", "Arteria Meníngea y Oftálmica"], h: "Nacen detrás del cuello del cóndilo.", f: "Sus dos terminales son la temporal superficial y la maxilar interna." },
        { q: "¿Qué dirección toma la arteria temporal superficial?", a: "Vertical ascendente", w: ["Horizontal hacia adelante", "Oblicua hacia la boca", "Descendente hacia el cuello"], h: "Pasa por delante del conducto auditivo externo.", f: "Se dirige hacia arriba, buscando la región del cuero cabelludo temporal." },
        { q: "¿Qué nervio acompaña a la arteria temporal superficial en su trayecto?", a: "Nervio auriculotemporal", w: ["Nervio facial", "Nervio hipogloso", "Nervio vago"], h: "Pasa por delante del trago de la oreja.", f: "El nervio auriculotemporal (rama del V3) es su relación constante." },
        { q: "¿Cuáles son las ramas colaterales de la temporal superficial?", a: "Art. transversa de la cara, Art. cigomático-orbitaria y Art. temporal profunda posterior", w: ["Art. dentaria e incisiva", "Art. ranina y sublingual", "Art. palatina y faríngea"], h: "Irrigan la ATM, mejilla y músculo temporal.", f: "Entre ellas destaca la transversa de la cara para la región geniana." },
        { q: "¿Qué arteria irriga la ATM (Articulación Temporomandibular) proveniente de la temporal superficial?", a: "Ramos articulares", w: ["Arteria maseterina", "Arteria meníngea", "Arteria dental"], h: "Nutren la cápsula y el cóndilo.", f: "Emite ramos específicos para la articulación mandibular." },
        { q: "¿Cuáles son las ramas terminales de la temporal superficial?", a: "Rama anterior o frontal y rama posterior o parietal", w: ["Arteria maxilar y facial", "Arteria nasal y lagrimal", "Arteria occipital y auricular"], h: "Se distribuyen por el cuero cabelludo.", f: "Se bifurca en ramos frontal y parietal para la calota." },
        { q: "¿Cuál es la rama terminal de la carótida externa que se dirige hacia la fosa cigomática?", a: "Arteria Maxilar Interna", w: ["Arteria Temporal Superficial", "Arteria Facial", "Arteria Lingual"], h: "Es la más compleja de las terminales.", f: "La maxilar interna abandona la parótida para entrar en la fosa cigomática." },
        { q: "¿Qué estructura atraviesa la arteria maxilar interna para entrar a la fosa cigomática?", a: "Ojal retrocondíleo de Juvara", w: ["Agujero redondo", "Agujero oval", "Conducto auditivo"], h: "Formado por el cuello del cóndilo y un ligamento.", f: "Pasa por el ojal limitado por el cuello del cóndilo y el ligamento esfenomaxilar." },
        { q: "¿Cuál es el músculo satélite de la arteria maxilar interna?", a: "Músculo pterigoideo externo", w: ["Músculo masetero", "Músculo temporal", "Músculo pterigoideo interno"], h: "Define si la arteria es superficial o profunda.", f: "Se relaciona íntimamente con el músculo pterigoideo externo en todo su trayecto." },
        { q: "¿Cómo se divide el trayecto de la maxilar interna en relación al pterigoideo externo?", a: "Variedad superficial (por fuera) y variedad profunda (por dentro)", w: ["Variedad anterior y posterior", "Variedad superior e inferior", "Variedad ósea y muscular"], h: "Depende de su posición respecto al músculo.", f: "Se describen estas dos variedades según rodee al músculo lateral o medialmente." },
        { q: "¿Cuántas ramas colaterales tiene la arteria maxilar interna según la descripción clásica?", a: "14 ramas colaterales", w: ["6 ramas", "10 ramas", "20 ramas"], h: "Se dividen en ascendentes, descendentes, anteriores y posteriores.", f: "Emite 14 colaterales antes de su rama terminal." },
        // BASE DE DATOS PROCESADA (PREGUNTAS 151-175)
        { q: "¿Cómo se clasifican las 14 ramas colaterales de la arteria maxilar interna?", a: "5 ascendentes, 5 descendentes, 2 anteriores y 2 posteriores", w: ["4 ascendentes, 4 descendentes y 6 laterales", "7 superiores y 7 inferiores", "5 anteriores, 5 posteriores y 4 medias"], h: "Siguen una lógica de distribución espacial.", f: "Se dividen en 5 ascendentes, 5 descendentes, 2 anteriores y 2 posteriores." },
        { q: "¿Cuáles son las 5 ramas colaterales ascendentes de la maxilar interna?", a: "Timpánica, Meníngea media, Meníngea menor, Temporal profunda media y Temporal profunda anterior", w: ["Dentaria, Bucal, Maseterina, Pterigoidea y Palatina", "Vidiana, Pterigopalatina, Alveolar y Suborbitaria", "Facial, Lingual, Laríngea, Occipital y Auricular"], h: "Van hacia el cráneo y la sien.", f: "Son: timpánica, meníngea media, meníngea menor, temporal profunda media y temporal profunda anterior." },
        { q: "¿Qué orificio atraviesa la arteria timpánica y qué irriga?", a: "Cisura de Glaser; irriga la caja del tímpano", w: ["Agujero redondo; irriga el ojo", "Conducto auditivo interno; irriga el caracol", "Agujero oval; irriga la mandíbula"], h: "Es la primera rama ascendente.", f: "Pasa por la cisura de Glaser para irrigar la mucosa del oído medio." },
        { q: "¿Qué estructura nerviosa forma un ojal alrededor de la arteria meníngea media?", a: "Nervio auriculotemporal", w: ["Nervio facial", "Nervio dentario inferior", "Nervio lingual"], h: "Es un ramo del nervio maxilar inferior (V3).", f: "El nervio auriculotemporal se bifurca formando un ojal por donde pasa la arteria meníngea media." },
        { q: "¿Por qué orificio ingresa la arteria meníngea media al cráneo?", a: "Agujero redondo menor (o espinoso)", w: ["Agujero redondo mayor", "Agujero oval", "Conducto carotídeo"], h: "Se ubica por detrás del agujero oval.", f: "Ingresa a la cavidad craneal por el agujero redondo menor." },
        { q: "¿Cuál es el territorio de irrigación de la arteria meníngea media?", a: "Duramadre y huesos del cráneo", w: ["Cerebro y cerebelo", "Músculos masticadores", "Dientes superiores"], h: "Es una arteria principalmente de las cubiertas cerebrales.", f: "Irriga la mayor parte de la duramadre y la tabla interna de los huesos del cráneo." },
        { q: "¿Por qué orificio ingresa la arteria meníngea menor al cráneo?", a: "Agujero oval", w: ["Agujero redondo menor", "Hendidura esfenoidal", "Conducto palatino"], h: "Acompaña al nervio maxilar inferior.", f: "La meníngea menor (o accesoria) entra al cráneo por el agujero oval." },
        { q: "¿Qué estructura importante irriga la arteria meníngea menor?", a: "Ganglio de Gasser (del Trigémino)", w: ["Glándula hipófisis", "Seno maxilar", "Bulbo raquídeo"], h: "Es el centro sensitivo del V par.", f: "Irriga la duramadre vecina y fundamentalmente el ganglio de Gasser." },
        { q: "¿Qué músculos irrigan las arterias temporales profundas media y anterior?", a: "Músculo temporal", w: ["Músculo masetero", "Músculos pterigoideos", "Músculo buccinador"], h: "Son ramas ascendentes de la fosa cigomática.", f: "Se distribuyen por la cara profunda del músculo temporal." },
        { q: "¿Cuáles son las 5 ramas colaterales descendentes de la maxilar interna?", a: "Dentaria inferior, Maseterina, Bucal, Pterigoidea y Palatina superior (o descendente)", w: ["Timpánica, Meníngea, Temporal y Esfenopalatina", "Alveolar, Suborbitaria, Vidiana y Pterigopalatina", "Facial, Lingual, Facial y Tiroidea"], h: "Van hacia la mandíbula y la mejilla.", f: "Son: dentaria inferior, maseterina, bucal, pterigoidea y palatina superior." },
        { q: "¿Dónde nace la arteria dentaria inferior y hacia dónde se dirige?", a: "Nace en la fosa cigomática y se dirige al conducto dentario", w: ["Nace en el maxilar y va al ojo", "Nace en la parótida y va al cuello", "Nace en el cráneo y va a la lengua"], h: "Es la arteria principal para los dientes inferiores.", f: "Desciende entre los músculos pterigoideos hasta el agujero dentario inferior." },
        { q: "¿Qué rama emite la dentaria inferior antes de entrar al conducto dentario?", a: "Arteria milohioidea", w: ["Arteria submentoniana", "Arteria lingual", "Arteria incisiva"], h: "Pasa por un surco en la cara interna de la mandíbula.", f: "La arteria milohioidea es la rama colateral más importante de la dentaria inferior." },
        { q: "¿Qué estructuras irriga la arteria milohioidea?", a: "Músculo milohioideo y vientre anterior del digástrico", w: ["Lengua", "Dientes molares", "Labio inferior"], h: "Irriga el piso de la boca.", f: "Se distribuye por el músculo milohioideo y el digástrico anterior." },
        { q: "¿Cuáles son las ramas terminales de la arteria dentaria inferior?", a: "Arteria mentoniana y arteria incisiva", w: ["Arteria bucal y alveolar", "Arteria sublingual y ranina", "Arteria maxilar y temporal"], h: "Nacen dentro del conducto a nivel de premolares.", f: "La mentoniana sale por el agujero mentoniano y la incisiva sigue por el hueso." },
        { q: "¿Qué estructuras irriga la arteria mentoniana?", a: "Partes blandas del mentón y labio inferior", w: ["Dientes incisivos", "Lengua", "Encía lingual"], h: "Sale a la cara por un agujero homónimo.", f: "Irriga el tejido blando mentoniano y se anastomosa con la submentoniana." },
        { q: "¿Qué estructura atraviesa la arteria maseterina para llegar a su músculo?", a: "Escotadura sigmoidea de la mandíbula", w: ["Conducto dentario", "Conducto auditivo", "Agujero redondo"], h: "Pasa por el borde superior de la rama mandibular.", f: "Atraviesa la escotadura sigmoidea para alcanzar la cara profunda del masetero." },
        { q: "¿Qué músculo perfora la arteria bucal (rama de la maxilar)?", a: "Músculo buccinador", w: ["Músculo masetero", "Músculo temporal", "Músculo risorio"], h: "Irriga la mejilla.", f: "Perfora el buccinador para irrigar la mucosa de la mejilla y la encía vestibular." },
        { q: "¿Qué irrigan las arterias pterigoideas?", a: "Músculos pterigoideos interno y externo", w: ["Músculo temporal", "Músculo masetero", "Hueso maxilar"], h: "Son ramas cortas de la maxilar.", f: "Se distribuyen directamente por los músculos pterigoideos." },
        { q: "¿Por qué conducto desciende la arteria palatina superior (o descendente)?", a: "Conducto palatino posterior", w: ["Conducto dentario", "Conducto suborbitario", "Agujero oval"], h: "Va hacia el paladar duro.", f: "Pasa por el conducto palatino posterior para irrigar el paladar óseo." },
        { q: "¿Cuáles son las 2 ramas colaterales anteriores de la maxilar interna?", a: "Arteria alveolar (o dentaria posterior) y arteria suborbitaria (o infraorbitaria)", w: ["Arteria bucal y maseterina", "Arteria meníngea y timpánica", "Arteria vidiana y pterigopalatina"], h: "Irrigan el maxilar superior.", f: "Son la alveolar y la suborbitaria." },
        { q: "¿Qué estructuras irriga la arteria alveolar (dentaria posterior)?", a: "Molares superiores, encía vestibular y seno maxilar", w: ["Incisivos inferiores", "Pared lateral de la nariz", "Paladar blando"], h: "Se apoya en la tuberosidad del maxilar.", f: "Irriga los molares y premolares superiores, además de la mucosa del seno." },
        { q: "¿Qué trayecto realiza la arteria suborbitaria (infraorbitaria)?", a: "Ingresa a la órbita por la hendidura esfenomaxilar y sale por el agujero suborbitario", w: ["Entra al cráneo por el redondo", "Va por el conducto dentario", "Baja por el paladar"], h: "Recorre el piso de la órbita.", f: "Pasa por el conducto suborbitario y aparece en la cara por el agujero infraorbitario." },
        { q: "¿Qué rama importante da la suborbitaria dentro de su conducto?", a: "Arteria dentaria anterior", w: ["Arteria dentaria posterior", "Arteria palatina", "Arteria nasal"], h: "Irriga los dientes anteriores superiores.", f: "La dentaria anterior nace en el conducto suborbitario para incisivos y caninos." },
        { q: "¿Cuáles son las 2 ramas colaterales posteriores de la maxilar interna?", a: "Arteria vidiana y arteria pterigopalatina", w: ["Arteria meníngea y timpánica", "Arteria alveolar y dental", "Arteria facial y lingual"], h: "Van hacia la parte posterior de la cavidad nasal y faringe.", f: "Son la vidiana (o del conducto pterigoideo) y la pterigopalatina." },
        { q: "¿Cuál es la rama terminal de la arteria maxilar interna?", a: "Arteria esfenopalatina", w: ["Arteria palatina mayor", "Arteria suborbitaria", "Arteria meníngea"], h: "Ingresa a las fosas nasales por el agujero homónimo.", f: "La maxilar interna termina al pasar por el agujero esfenopalatino." },
        // BASE DE DATOS PROCESADA (PREGUNTAS 176-200)
        { q: "¿Qué orificio atraviesa la arteria esfenopalatina para entrar a las fosas nasales?", a: "Agujero esfenopalatino", w: ["Agujero redondo", "Conducto palatino anterior", "Hendidura esfenoidal"], h: "Comunica la fosa pterigomaxilar con las fosas nasales.", f: "La arteria esfenopalatina ingresa a las fosas nasales por el agujero homónimo." },
        { q: "¿Cuáles son las ramas terminales de la arteria esfenopalatina?", a: "Arteria de los cornetes y los meatos (interna) y arteria del tabique (externa)", w: ["Arteria nasal y frontal", "Arteria labial y bucal", "Arteria dentaria e incisiva"], h: "Se distribuyen por las paredes lateral y medial de la nariz.", f: "Se divide en una rama para la pared externa (cornetes) y otra para el tabique." },
        { q: "¿Qué nombre recibe la rama del tabique de la esfenopalatina y por qué conducto pasa?", a: "Arteria nasopalatina; pasa por el conducto palatino anterior", w: ["Arteria vidiana; pasa por el conducto pterigoideo", "Arteria palatina; pasa por el conducto posterior", "Arteria etmoidal; pasa por el agujero etmoidal"], h: "Llega a la parte más anterior del paladar duro.", f: "La nasopalatina recorre el tabique y desciende por el conducto palatino anterior (incisivo)." },

        { q: "¿Por qué orificio sale la arteria que irriga el sector anterior del paladar duro?", a: "Conducto palatino anterior (incisivo)", w: ["Agujero palatino mayor", "Conducto suborbitario", "Cisura de Glaser"], h: "La arteria es la nasopalatina.", f: "La arteria nasopalatina sale por el conducto incisivo para irrigar la mucosa detrás de los incisivos superiores." },
        { q: "¿Qué nombre recibe el espolón situado en el origen de las ramas colaterales arteriales?", a: "Espolón de Rein", w: ["Espolón de Wolf", "Válvula de Tebesio", "Nódulo de Arancio"], h: "Ayuda a dirigir el flujo sanguíneo.", f: "El espolón arterial es una formación en el ángulo de emergencia de las colaterales." },
        { q: "¿Qué relación de volumen existe generalmente entre el tronco principal y sus colaterales?", a: "La suma de las secciones de las colaterales supera la sección del tronco principal", w: ["El tronco principal siempre es el doble de las colaterales", "Son exactamente iguales", "Las colaterales son siempre más pequeñas"], h: "Esto reduce la velocidad del flujo periférico.", f: "Según las leyes de la angiología, el área de sección aumenta a medida que las arterias se ramifican." },
        { q: "¿Qué arteria es responsable de la mayor parte de las hemorragias en cirugías de paladar óseo posterior?", a: "Arteria palatina mayor (superior)", w: ["Arteria nasopalatina", "Arteria esfenopalatina", "Arteria bucal"], h: "Sale por el agujero palatino mayor.", f: "La palatina mayor es el tronco principal que recorre el paladar duro de atrás hacia adelante." },
        { q: "¿Qué vena de la cara carece de válvulas, facilitando infecciones retrógradas?", a: "Vena facial", w: ["Vena yugular interna", "Vena subclavia", "Vena lingual"], h: "Comunica con el seno cavernoso.", f: "La ausencia de válvulas en la vena facial permite que la sangre e infecciones fluyan hacia el endocráneo." },
        { q: "¿Qué es el ligamento arterial y cuál es su origen embriológico?", a: "Remanente fibroso del conducto arterioso fetal", w: ["Un ligamento que sostiene la aorta", "El tendón de los músculos papilares", "Una parte del pericardio"], h: "Unía la arteria pulmonar con la aorta.", f: "El ligamento arterial es el vestigio del conducto que en el feto comunicaba la pulmonar con la aorta." },
        { q: "¿Cuál es la situación general de las arterias en las extremidades?", a: "Profundas, generalmente aplicadas a los huesos o en vainas musculares", w: ["Superficiales, por encima de la fascia", "Dentro de las cavidades articulares", "Entre la piel y el tejido celular"], h: "Están protegidas de traumatismos externos.", f: "Las arterias suelen ocupar planos profundos y protegidos, a menudo en la cara de flexión de las articulaciones." },

        { q: "¿Qué arteria irriga la glándula tiroides desde la subclavia?", a: "Arteria tiroidea inferior", w: ["Arteria tiroidea superior", "Arteria tiroidea media", "Arteria laríngea"], h: "Es rama del tronco tirobicervicoescapular.", f: "La tiroidea inferior nace de la subclavia, mientras que la superior nace de la carótida externa." },

        { q: "¿Cómo se denomina la inflamación de los vasos linfáticos que se ve como líneas rojas en la piel?", a: "Linfangitis", w: ["Adenitis", "Flebilitis", "Arteritis"], h: "Sigue el trayecto de los vasos hacia los ganglios.", f: "La linfangitis es la inflamación de los vasos linfáticos, a menudo por infección." },
        { q: "¿Qué estructura linfática se encuentra en el mediastino superior y retrocede en la adultez?", a: "Timo", w: ["Bazo", "Amígdala", "Ganglio de Küttner"], h: "Es un órgano linfoide primario.", f: "El timo es fundamental en la maduración de linfocitos T y se atrofia tras la pubertad." },

        // BASE DE DATOS PROCESADA (PREGUNTAS 351-375)
        { q: "¿Qué estructuras forman el Anillo Linfático de Waldeyer?", a: "Amígdalas faríngea, tubáricas, palatinas y lingual", w: ["Ganglios submaxilares y submentonianos", "Conducto torácico y bazo", "Ganglios yugulares y cervicales"], h: "Es la primera línea de defensa de las vías aéreas y digestivas.", f: "El anillo de Waldeyer es un conjunto de tejido linfático que rodea el istmo de las fauces y la faringe." },

        { q: "¿Qué relación tiene el paquete vasculonervioso del cuello en un corte a nivel de C6?", a: "Se encuentra por delante de las apófisis transversas y lateral a la glándula tiroides", w: ["Detrás de la columna vertebral", "Dentro de la tráquea", "Entre el esófago y la columna"], h: "Es la zona del tubérculo de Chassaignac.", f: "A nivel de C6, el paquete (carótida, yugular y vago) se sitúa lateralmente a las vísceras del cuello." },
        { q: "¿Qué vena del tórax recoge la sangre de las venas intercostales?", a: "Sistema de las venas Ácigos", w: ["Vena cava superior", "Vena cava inferior", "Vena yugular interna"], h: "Es un puente entre las dos cavas.", f: "Las venas ácigos drenan la pared torácica y desembocan en la vena cava superior." },

        { q: "¿Qué ganglio se inflama frecuentemente en faringitis y se palpa bajo el ángulo mandibular?", a: "Ganglio yugulodigástrico (de Küttner)", w: ["Ganglio submentoniano", "Ganglio occipital", "Ganglio mastoideo"], h: "Es el más alto de la cadena yugular profunda.", f: "El ganglio de Küttner es el receptor principal de la linfa amigdalina y lingual posterior." },
        { q: "¿Qué vena superficial del antebrazo se utiliza comúnmente para inyecciones en el consultorio?", a: "Vena mediana del antebrazo", w: ["Vena yugular", "Vena axilar", "Vena facial"], h: "Forma parte de la M venosa del codo.", f: "La vena mediana es de fácil acceso y calibre adecuado para venoclisis." },

        { q: "¿Qué arteria irriga la encía vestibular de los premolares superiores?", a: "Arteria alveolar superior posterior y arteria infraorbitaria", w: ["Arteria palatina mayor", "Arteria lingual", "Arteria mentoniana"], h: "Depende de la zona de transición del maxilar.", f: "La irrigación gingival superior proviene de las ramas de la maxilar interna." },
        { q: "¿Qué relación tiene la arteria carótida primitiva con la tráquea?", a: "La carótida es lateral a la tráquea", w: ["La carótida es anterior a la tráquea", "La carótida es posterior a la tráquea", "La carótida atraviesa la tráquea"], h: "Están separadas por el lóbulo tiroideo.", f: "En el cuello inferior, la carótida primitiva asciende a los lados del conducto respiratorio." },

        { q: "¿Cuál es la consistencia normal de un ganglio linfático a la palpación?", a: "Blanda o elástica, móvil y no dolorosa", w: ["Pétrea o dura como hueso", "Líquida como un quiste", "Fija a los planos profundos"], h: "Si es duro y fijo, sugiere malignidad.", f: "Un ganglio sano suele ser imperceptible o de consistencia elástica y gran movilidad." },

        { q: "¿Cuál es la situación de las venas respecto a las arterias en el cuello?", a: "Generalmente las venas son más superficiales y externas que las arterias", w: ["Las arterias son más superficiales", "Están siempre en el mismo plano", "Las venas son mediales a las arterias"], h: "La yugular interna es lateral a la carótida.", f: "En el paquete vasculonervioso, la vena yugular ocupa la posición más externa." },

        // BASE DE DATOS PROCESADA (PREGUNTAS 376-400)

        { q: "¿Cuál es la relación de la arteria carótida interna con la trompa de Eustaquio en el peñasco?", a: "La arteria es anterior y medial a la trompa", w: ["La arteria atraviesa la trompa", "La arteria es lateral a la trompa", "No tienen relación ósea"], h: "Están muy cerca en la porción horizontal del conducto.", f: "Esta vecindad explica por qué a veces se escuchan latidos en el oído durante procesos inflamatorios." },
        { q: "¿Qué vena drena el espacio intercostal superior izquierdo?", a: "Vena intercostal superior izquierda (va al tronco braquiocefálico)", w: ["Vena ácigos mayor", "Vena cava superior", "Vena hemiácigos"], h: "Diferencia importante con el lado derecho.", f: "El drenaje venoso torácico superior izquierdo suele ir directo al tronco venoso, no al sistema ácigos." },
        { q: "¿Qué arteria irriga la duramadre de la fosa craneal posterior y entra por el agujero rasgado posterior?", a: "Arteria meníngea posterior", w: ["Arteria meníngea media", "Arteria meníngea menor", "Arteria oftálmica"], h: "Rama de la faríngea inferior.", f: "La meníngea posterior es la encargada de la irrigación de la duramadre en la región del cerebelo." },
        { q: "¿Cuál es el reparo anatómico para la punción de la arteria subclavia?", a: "Debajo de la mitad de la clavícula", w: ["Sobre el manubrio esternal", "En el borde anterior del trapecio", "En la axila"], h: "Relación con la primera costilla.", f: "Se aborda por debajo de la clavícula para procedimientos de vía central o cateterismo." },
        { q: "¿Qué nombre recibe la comunicación entre la vena facial y el plexo pterigoideo a través de la mejilla?", a: "Vena comunicante de la cara (facial profunda)", w: ["Vena oftálmica", "Vena lingual", "Vena yugular"], h: "Vía de propagación de celulitis faciales.", f: "Es el nexo venoso que permite que procesos infecciosos superficiales pasen a la profundidad." },
        { q: "¿Qué estructura vascular irriga el ligamento periodontal?", a: "Arterias dentarias (ramas de la maxilar interna)", w: ["Arterias palatinas", "Arteria facial", "Arteria lingual"], h: "Entran por el foramen apical y las paredes del alveolo.", f: "El ligamento periodontal recibe una rica red vascular de las arterias alveolares y dentarias." },
        { q: "¿Qué arteria se encuentra en el espesor del músculo milohioideo y puede ser dañada en cirugías de implantes?", a: "Arteria milohioidea", w: ["Arteria sublingual", "Arteria facial", "Arteria carótida"], h: "Es rama de la dentaria inferior.", f: "La arteria milohioidea corre por la cara interna de la mandíbula y nutre al músculo homónimo." },
        { q: "¿Qué vena de la cabeza no posee válvulas y comunica con el seno longitudinal superior?", a: "Venas emisarias", w: ["Venas yugulares", "Vena facial", "Vena maxilar"], h: "Atraviesan los huesos del cráneo.", f: "Las venas emisarias (como la parietal) permiten la comunicación entre la circulación interna y externa del cráneo." },
        { q: "¿Dónde se localiza el pulso de la arteria carótida externa en la cara?", a: "No es habitual palparla directamente en la cara, se palpan sus ramas terminales", w: ["Debajo del mentón", "En el ángulo de la mandíbula", "Dentro de la boca"], h: "La carótida externa termina dentro de la parótida.", f: "Lo que se palpa en la cara son las arterias facial, temporal superficial y maxilar (pulso maxilar difícil)." },
        { q: "¿Qué arteria irriga la amígdala lingual?", a: "Arteria dorsal de la lengua (rama de la lingual)", w: ["Arteria sublingual", "Arteria ranina", "Arteria palatina"], h: "Irriga el tercio posterior lingual.", f: "La dorsal de la lengua se encarga de la irrigación de la base de la lengua y el tejido linfoide asociado." },
        { q: "¿Cómo se llama el estrechamiento de la aorta justo después del nacimiento del ligamento arterial?", a: "Istmo de la aorta", w: ["Cayado", "Bulbo aórtico", "Seno de Valsalva"], h: "Zona frecuente de coartación (estrechez patológica).", f: "El istmo es la porción de la aorta situada entre la subclavia izquierda y el ligamento arterial." },
        { q: "¿Qué arteria irriga la glándula sublingual y el frenillo de la lengua?", a: "Arteria sublingual", w: ["Arteria ranina", "Arteria mentoniana", "Arteria submentoniana"], h: "Es terminal de la lingual.", f: "La sublingual es la arteria de mayor importancia en el piso anterior de la boca." },

        { q: "¿Qué relación tiene el arco de la aorta con el bronquio izquierdo?", a: "El arco pasa por encima del bronquio izquierdo", w: ["Pasa por debajo", "Pasa por detrás", "Pasa por delante"], h: "Lo 'cabalga' de adelante hacia atrás.", f: "Es una de las relaciones mediastínicas más importantes para identificar las estructuras en radiografías." },
        { q: "¿Qué estructura drena la linfa de los molares inferiores?", a: "Ganglios submaxilares", w: ["Ganglios submentonianos", "Ganglios parotídeos", "Ganglios occipitales"], h: "Drenan hacia la cadena yugular interna después.", f: "La mayoría de los dientes (salvo incisivos inferiores) drenan primero en los ganglios submaxilares." },
        { q: "¿Qué arteria irriga el vientre anterior del músculo digástrico?", a: "Arteria submentoniana", w: ["Arteria occipital", "Arteria auricular", "Arteria lingual"], h: "Es rama de la facial.", f: "La submentoniana recorre el borde inferior de la mandíbula e irriga al digástrico anterior." },
        { q: "¿Dónde se palpa el pulso de la arteria temporal superficial?", a: "Por delante del trago de la oreja", w: ["En la sien", "Detrás de la oreja", "En la frente"], h: "Sobre el arco cigomático.", f: "Es el punto más accesible para evaluar el flujo de la carótida externa en la cabeza." },
        { q: "¿Qué vena drena la sangre del paladar duro hacia el plexo pterigoideo?", a: "Venas palatinas", w: ["Vena facial", "Vena oftálmica", "Vena lingual"], h: "Siguen el trayecto de las arterias homónimas.", f: "El drenaje venoso del paladar es tributario del plexo venoso de la fosa infratemporal." },
        { q: "¿Cuál es el destino final de toda la linfa del cuerpo?", a: "El sistema venoso (confluentes yugulosubclavios)", w: ["El hígado", "Los riñones", "La arteria aorta"], h: "Pasa por el conducto torácico o la gran vena linfática.", f: "Toda la linfa retorna a la circulación sanguínea en la base del cuello." },
];

    let deck = [...pool];
    let currentIdx = 0;
    let correctInRow = 0;

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    function loadCard() {
        const q = deck[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('counter').innerText = `${currentIdx + 1}/${deck.length}`;
        document.getElementById('progress-bar').style.width = `${((currentIdx) / deck.length) * 100}%`;
        
        const opts = shuffle([q.a, ...q.w]);
        const container = document.getElementById('options');
        container.innerHTML = '';
        
        opts.forEach(o => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = o;
            btn.onclick = () => checkAnswer(btn, o === q.a);
            container.appendChild(btn);
        });

        document.getElementById('hint-text').innerText = q.h;
        document.getElementById('hint-text').style.display = 'none';
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('hint-btn').style.display = 'block';
    }

    function checkAnswer(btn, isCorrect) {
        const q = deck[currentIdx];
        const allBtn = document.querySelectorAll('.option');
        allBtn.forEach(b => {
            b.classList.add('disabled');
            if(b.innerText === q.a) b.classList.add('correct');
        });

        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        
        if(isCorrect) {
            btn.classList.add('correct');
            fb.innerHTML = `<strong>¡Correcto!</strong> ${q.f}`;
            fb.style.borderColor = 'var(--success)';
        } else {
            btn.classList.add('wrong');
            fb.innerHTML = `<strong>Incorrecto.</strong> ${q.f}`;
            fb.style.borderColor = 'var(--danger)';
            // Lógica Leitner: Si falla, la pregunta se mueve al final para repetir
            deck.push(deck.splice(currentIdx, 1)[0]);
            currentIdx--; 
        }
        document.getElementById('next-btn').style.display = 'block';
    }

    function toggleHint() {
        const ht = document.getElementById('hint-text');
        ht.style.display = ht.style.display === 'none' ? 'block' : 'none';
    }

    function handleNext() {
        currentIdx++;
        if(currentIdx < deck.length) loadCard();
        else alert("¡Tanda completada! Recomenzando repaso.");
    }

    loadCard();
    
</script>
